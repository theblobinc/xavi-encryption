[package]
name = "xavi-void-tfhe-split"
version = "1.2.0-dev5"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "Split client/evaluator TFHE-rs providers for xavi-void"

[features]
default = ["cpu"]
cpu = []
cuda = ["tfhe/gpu"]

[dependencies]
base64 = "0.22"
bincode = "1.3.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha3 = "0.10"
tfhe = { version = "=1.8.0", default-features = false, features = ["boolean", "shortint", "integer"] }

[[bin]]
name = "xvoid-tfhe-client"
path = "src/bin/client.rs"

[[bin]]
name = "xvoid-tfhe-evaluator"
path = "src/bin/evaluator.rs"
