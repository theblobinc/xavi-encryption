[package]
name = "xavi-void-tfhe-sidecar"
version = "1.2.0-dev5"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "TFHE-rs sidecar for xavi-void encrypted ExecutionIR"

[features]
default = ["cpu"]
cpu = []
cuda = ["tfhe/gpu"]

[dependencies]
base64 = "0.22"
bincode = "1.3.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha3 = "0.10"
tfhe = { version = "=1.8.0", default-features = false, features = ["boolean", "shortint", "integer"] }
